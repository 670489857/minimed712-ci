name: Loop app (unsigned IPA)

on:
  workflow_dispatch:

jobs:
  build-loop:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout patched MinimedKit
        uses: actions/checkout@v4
        with:
          path: patched-minimed

      - name: Install watchOS platform
        run: |
          set -euxo pipefail
          xcodebuild -downloadPlatform watchOS
          xcodebuild -showsdks

      - name: Clone LoopWorkspace and submodules
        run: |
          set -euxo pipefail
          git clone --depth 1 --branch dev https://github.com/LoopKit/LoopWorkspace.git ws
          cd ws
          git submodule update --init --recursive
          git submodule status | head -30

      - name: Use patched MinimedKit
        run: |
          set -euxo pipefail
          rm -rf ws/MinimedKit
          cp -R patched-minimed ws/MinimedKit
          rm -rf ws/MinimedKit/.git
          grep -n "remote control setup skipped" \
            ws/MinimedKit/MinimedKitUI/Setup/MinimedPumpIDSetupViewController.swift
          grep -n "is512or712Family" \
            ws/MinimedKit/MinimedKit/PumpManager/MinimedPumpManager.swift | head

      - name: Build LoopWorkspace (Release, unsigned)
        run: |
          set -o pipefail
          cd ws
          xcodebuild \
            -workspace LoopWorkspace.xcworkspace \
            -scheme LoopWorkspace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || { tail -250 build.log; exit 1; }
          grep -E "BUILD SUCCEEDED|BUILD FAILED" build.log | tail -5

      - name: Package unsigned IPA
        run: |
          set -euxo pipefail
          cd ws
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 2 -name "Loop.app" -type d -print -quit)
          test -n "$APP"
          echo "APP=$APP"
          ls -ld "$APP"
          ls "$APP/Frameworks" | head -30
          rm -rf Payload Loop-712E-unsigned.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Loop-712E-unsigned.ipa Payload
          ls -lh Loop-712E-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Loop-712E-unsigned-ipa
          path: ws/Loop-712E-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
